# Replace with your own test VMs. Never commit real passwords;
# use ansible-vault or environment variables for secrets.

[linux]
linux-vm-01 ansible_host=<LINUX_VM_1_IP>
linux-vm-02 ansible_host=<LINUX_VM_2_IP>

[linux:vars]
ansible_user=<ssh_user>
ansible_ssh_private_key_file=~/.ssh/<your_key>

[windows]
win-vm-01 ansible_host=<WINDOWS_VM_IP>

[windows:vars]
ansible_user=<windows_user>
ansible_password={{ vault_windows_password }}
ansible_connection=winrm
ansible_winrm_transport=ntlm
ansible_winrm_server_cert_validation=ignore
ansible_port=5986
