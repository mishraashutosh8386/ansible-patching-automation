---
# Patch Linux servers (Debian/Ubuntu and RHEL family), one host at a time,
# and reboot only when the OS says a reboot is required.
- name: Patch Linux servers
  hosts: linux
  become: true
  serial: 1            # patch one server at a time to limit impact

  tasks:
    - name: Upgrade all packages (Debian/Ubuntu)
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        upgrade: dist
      when: ansible_os_family == "Debian"

    - name: Upgrade all packages (RHEL family)
      ansible.builtin.dnf:
        name: "*"
        state: latest
      when: ansible_os_family == "RedHat"

    - name: Check if reboot is required (Debian/Ubuntu)
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_file
      when: ansible_os_family == "Debian"

    - name: Check if reboot is required (RHEL family)
      ansible.builtin.command: needs-restarting -r
      register: needs_restart
      changed_when: false
      failed_when: needs_restart.rc not in [0, 1]
      when: ansible_os_family == "RedHat"

    - name: Reboot if required (Debian/Ubuntu)
      ansible.builtin.reboot:
        reboot_timeout: 600
      when: ansible_os_family == "Debian" and reboot_required_file.stat.exists

    - name: Reboot if required (RHEL family)
      ansible.builtin.reboot:
        reboot_timeout: 600
      when: ansible_os_family == "RedHat" and needs_restart.rc == 1
